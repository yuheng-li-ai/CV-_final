manual_score_rubric:
  scale: "1_to_5_integer"
  geometry:
    "1": broken_or_unusable_geometry
    "2": recognizable_with_major_holes_or_duplicate_surfaces
    "3": mostly_complete_with_visible_artifacts
    "4": complete_and_stable_from_most_views
    "5": clean_stable_report_ready
  texture:
    "1": missing_or_severely_polluted_texture
    "2": recognizable_with_major_artifacts
    "3": acceptable_with_visible_seams_or_blur
    "4": good_with_minor_artifacts
    "5": clean_and_consistent
  fusion_readiness:
    "1": cannot_be_placed
    "2": severe_scale_orientation_or_mesh_problems
    "3": usable_after_manual_cleanup
    "4": fits_scene_with_minor_tuning
    "5": ready_for_final_render
  fusion_video_stability:
    "1": unstable_or_visually_broken
    "2": large_floating_contact_or_lighting_artifacts
    "3": acceptable_but_visibly_imperfect
    "4": stable_with_minor_artifacts
    "5": final_report_quality
