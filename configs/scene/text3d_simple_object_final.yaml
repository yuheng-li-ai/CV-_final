experiment:
  name: text3d_simple_object_final
  command: generate-text3d
  stage: M3_final

tools:
  python: python
  wrapper_script: scripts/run_threestudio.py
  repo_dir: external/threestudio
  launch_script: external/threestudio/launch.py

prompt:
  text: "A single small matte blue rubber ball as a clean 3D asset, perfectly round smooth sphere, simple solid color material, subtle rough surface, no seams, no text, no logo, no pattern, centered isolated object, full object visible from every view, physically plausible tabletop scale, studio product lighting, high quality 3D model"
  negative_text: "extra objects, duplicate sphere, face, eyes, mouth, character, animal, text, logo, label, pattern, scene background, table, hands, plants, dents, holes, spikes, handles, melted shape, floating parts, disconnected pieces, asymmetry, Janus artifact, multi-head, blurry texture, low quality"
  config: configs/dreamfusion-sd.yaml

paths:
  output_dir: runs/scene/text3d_simple_object_final

runtime:
  gpu: 0
  mode: train
  tag: main
  max_steps: 10000
  width: 64
  height: 64
  batch_size: 1
  val_check_interval: 200
  gradio_progress: true
  extra_args:
    - system.prompt_processor.pretrained_model_name_or_path=/home/yuhengli/.cache/huggingface/hub/models--Manojb--stable-diffusion-2-1-base/snapshots/0094d483a120f3f33dafbd187ea4aa60d10de75c
    - system.guidance.pretrained_model_name_or_path=/home/yuhengli/.cache/huggingface/hub/models--Manojb--stable-diffusion-2-1-base/snapshots/0094d483a120f3f33dafbd187ea4aa60d10de75c
    - "system.prompt_processor.negative_prompt=extra objects, duplicate sphere, face, eyes, mouth, character, animal, text, logo, label, pattern, scene background, table, hands, plants, dents, holes, spikes, handles, melted shape, floating parts, disconnected pieces, asymmetry, Janus artifact, multi-head, blurry texture, low quality"

logging:
  enabled: false
  backend: wandb
  project: cvhw3-task1
  mode: offline
