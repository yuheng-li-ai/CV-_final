experiment:
  name: image3d_raw
  command: generate-image3d
  stage: M4_R5

tools:
  python: python
  wrapper_script: scripts/run_magic123.py
  repo_dir: external/Magic123
  entrypoint: external/Magic123/main.py

inputs:
  image_path: data/scene/object_c/raw/object_c.jpg
  mask_path: null

prompt:
  text: A single yellow cartoon toy creature, clean object, front view

paths:
  output_dir: runs/scene/image3d_raw

runtime:
  gpu: 0
  mode: both
  tag: raw
  coarse_iters: 5000
  fine_iters: 5000
  sd_version: "1.5"

preprocess:
  background_mode: raw
  centered_crop: false

logging:
  enabled: false
  backend: wandb
  project: cvhw3-task1
  mode: offline
