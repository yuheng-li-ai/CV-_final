experiment:
  name: background_2dgs_high
  command: train-2dgs
  stage: M1_R1_final

tools:
  python: python
  train_script: external/2d-gaussian-splatting/train.py
  render_script: external/2d-gaussian-splatting/render.py
  metrics_script: external/2d-gaussian-splatting/metrics.py

paths:
  source_scene: data/scene/background/garden/colmap
  output_dir: runs/scene/background_2dgs_high

training:
  iterations: 30000
  eval: true
  seed: 0
  ip: 127.0.0.1
  port: 6011

evaluation:
  iteration: 30000
  skip_train: true
  skip_test: false
  skip_mesh: true
  quiet: true

logging:
  enabled: false
  backend: wandb
  project: cvhw3-task1
  mode: offline
