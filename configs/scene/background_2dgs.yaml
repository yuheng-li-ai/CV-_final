experiment:
  name: background_2dgs
  command: train-2dgs
  draft_path: draft.md

tools:
  python: python
  train_script: external/2d-gaussian-splatting/train.py
  render_script: external/2d-gaussian-splatting/render.py
  metrics_script: external/2d-gaussian-splatting/metrics.py

paths:
  source_scene: data/scene/background/colmap
  output_dir: runs/scene/background_2dgs

training:
  iterations: 30000
  eval: true
  seed: 0

evaluation:
  iteration: 30000
  skip_train: true
  skip_test: false
  skip_mesh: true
  quiet: true

logging:
  enabled: false
  backend: wandb
  project: cvhw3-task1
  mode: offline
