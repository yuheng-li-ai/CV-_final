experiment:
  name: object_a_colmap
  command: prepare-object
  output_dir: runs/scene/object_a_colmap
  draft_path: draft.md

tools:
  ffmpeg: ffmpeg
  colmap: scripts/colmap_clean_env.sh

inputs:
  video_path: data/scene/object_a/raw/object_a.mp4

paths:
  image_dir: data/scene/object_a/frames
  workspace_dir: runs/scene/object_a_colmap/colmap

frame_extraction:
  fps: 2

colmap:
  camera_model: SIMPLE_RADIAL
  single_camera: true
  use_gpu: false

logging:
  enabled: false
  backend: wandb
  project: cvhw3-task1
  mode: offline
